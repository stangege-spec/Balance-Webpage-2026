name: Update blog and reviews

# Pulls new posts from the livebalancefit.com blog and the latest Google
# reviews into data/*.json, which the homepage reads. Runs every 6 hours;
# use "Run workflow" on the Actions tab to update right away.
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch blog posts and Google reviews
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACE_ID: ${{ vars.GOOGLE_PLACE_ID }}
        run: python3 scripts/update_feeds.py

      - name: Commit changes
        if: always()
        id: commit
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update blog posts and reviews"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made by this workflow don't always start a Pages build, so ask for one.
      - name: Rebuild GitHub Pages
        if: always() && steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
